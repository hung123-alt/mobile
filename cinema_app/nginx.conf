# Cấu hình nginx cho Flutter Web (PWA) trên Render
# - SPA fallback: mọi đường dẫn lạ → index.html (Flutter Router xử lý)
# - gzip + cache asset tĩnh
# - không cache index.html / flutter_service_worker.js để cập nhật được

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Dung lượng upload mặc định
    client_max_body_size 20m;

    # ----- Cache file tĩnh (hash trong tên nên cache mãi) -----
    location ~* \.(?:js|css|wasm|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----- Service worker: luôn lấy bản mới để PWA cập nhật -----
    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ----- Bootstrap + index: không cache -----
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /flutter_bootstrap.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ----- SPA fallback -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
